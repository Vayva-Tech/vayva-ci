name: Setup Vayva Workspace
description: Clone shared packages and configure pnpm workspace for monorepo builds

inputs:
  token:
    description: GitHub token with read access to Vayva-Tech repos
    required: true
  workspace-dir:
    description: Root directory for the workspace
    required: false
    default: ${{ github.workspace }}

runs:
  using: composite
  steps:
    - name: Clone shared packages
      shell: bash
      env:
        CROSS_REPO_TOKEN: ${{ inputs.token }}
        WORKSPACE: ${{ inputs.workspace-dir }}
      run: |
        set -e
        PACKAGES=(
          vayva-shared vayva-schemas vayva-middleware vayva-auth-middleware
          vayva-redis vayva-event-bus vayva-email vayva-compliance
          vayva-sdk vayva-plan-entitlements vayva-personalization
          vayva-semantic-layer vayva-ui
        )
        for pkg in "${PACKAGES[@]}"; do
          if [ ! -d "$WORKSPACE/$pkg" ]; then
            git clone --depth 1 "https://x-access-token:${CROSS_REPO_TOKEN}@github.com/Vayva-Tech/$pkg.git" "$WORKSPACE/$pkg"
          fi
        done

    - name: Configure npm registry
      shell: bash
      env:
        CROSS_REPO_TOKEN: ${{ inputs.token }}
        WORKSPACE: ${{ inputs.workspace-dir }}
      run: |
        cat > "$WORKSPACE/.npmrc" <<EOF
        @vayva-tech:registry=https://npm.pkg.github.com/
        //npm.pkg.github.com/:_authToken=${CROSS_REPO_TOKEN}
        minimum-release-age=0
        EOF

    - name: Generate pnpm workspace
      shell: bash
      env:
        WORKSPACE: ${{ inputs.workspace-dir }}
      run: |
        cat > "$WORKSPACE/pnpm-workspace.yaml" <<'WORKSPACE_EOF'
        packages:
          - "."
          - vayva-shared
          - vayva-schemas
          - vayva-middleware
          - vayva-auth-middleware
          - vayva-redis
          - vayva-event-bus
          - vayva-email
          - vayva-compliance
          - vayva-sdk
          - vayva-plan-entitlements
          - vayva-personalization
          - vayva-semantic-layer
          - vayva-ui
        frozenLockfile: false
        allowBuilds:
          "@prisma/client": true
          "@prisma/engines": true
          "@swc/core": true
          argon2: true
          esbuild: true
          prisma: true
          sharp: true
          unrs-resolver: true
          protobufjs: true
          "@parcel/watcher": true
          "@sentry/cli": true
          core-js-pure: true
          workerd: true
        overrides:
          react: 19.2.6
          react-dom: 19.2.6
          "@types/react": ^19
          "@types/react-dom": ^19
          fast-uri: ">=3.1.5"
          tar@<=7.5.18: ">=7.5.19"
          fastify@<=5.8.2: ">=5.8.3"
          next: ">=16.2.11"
          sharp: ">=0.35.0"
          nanoid@3: ">=3.3.18"
          postcss: ">=8.5.23"
          undici@7: ">=7.29.0"
          ip-address: ">=10.3.1"
          js-yaml@>=4.0.0: ">=4.3.1"
          brace-expansion@1: ">=1.1.18"
          image-size: ">=2.0.2"
          extract-zip: ">=2.0.1"
          tmp: ">=0.2.6"
          uuid: ">=12.0.1"
          cookie: ">=0.7.0"
          body-parser: ">=1.20.6"
          esbuild: ">=0.25.0"
          dompurify: ">=3.4.13"
          socket.io-parser: ">=4.2.7"
          find-my-way: ">=9.7.0"
          deepmerge-ts: ">=8.0.0"
          hono: ">=4.12.34"
          "@hono/node-server": ">=1.19.15"
          "@opentelemetry/core": ">=2.8.0"
          "@opentelemetry/propagator-jaeger": ">=2.9.0"
          "@opentelemetry/sdk-node": ">=0.217.0"
          "@opentelemetry/auto-instrumentations-node": ">=0.79.0"
        WORKSPACE_EOF
