name: Test With Env And Perms

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      release_sha:
        required: true
        type: string
    secrets:
      STAGING_SSH_KEY:
        required: true
      STAGING_SSH_HOST:
        required: true
      STAGING_SSH_USER:
        required: true

concurrency:
  group: test-${{ inputs.service-name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  STAGING_SSH_KNOWN_HOSTS: |
    13.140.159.213 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHSOnPRo9XffQN/8rN4Ym4X3ZK6gLq4Zuph4ANxF9/ex
    13.140.159.213 ssh-rsa 

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.resolve.outputs.image_tag }}
    steps:
      - name: Validate
        id: resolve
        run: |
          echo "image_tag=sha-${{ inputs.release_sha }}" >> "$GITHUB_OUTPUT"
          echo "Validated ${{ inputs.service-name }}"

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        run: |
          echo "Deploying ${{ inputs.service-name }} with tag ${{ needs.validate.outputs.image_tag }}"
          echo "Known hosts env: ${STAGING_SSH_KNOWN_HOSTS:0:30}..."
