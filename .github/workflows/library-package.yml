name: Vayva Library Package CI

on:
  workflow_call:
    inputs:
      package-name:
        description: Package name (e.g. vayva-personalization)
        required: false
        type: string
        default: ''
    secrets:
      NPM_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: self-hosted
    env:
      PNPM_MINIMUM_RELEASE_AGE: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm --version

      - name: Authenticate private registry
        run: |
          echo "@vayva-tech:registry=https://npm.pkg.github.com/" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc
          echo "minimum-release-age=0" >> .npmrc
          echo "onlyBuiltDependencies[]=esbuild" >> .npmrc
          echo "onlyBuiltDependencies[]=workerd" >> .npmrc
          echo "onlyBuiltDependencies[]=@swc/core" >> .npmrc
          echo "onlyBuiltDependencies[]=@sentry/cli" >> .npmrc
          echo "onlyBuiltDependencies[]=@parcel/watcher" >> .npmrc
          echo "onlyBuiltDependencies[]=protobufjs" >> .npmrc
          echo "onlyBuiltDependencies[]=core-js-pure" >> .npmrc
          echo "onlyBuiltDependencies[]=unrs-resolver" >> .npmrc

      - name: Install
        run: pnpm install --no-frozen-lockfile --config.minimum-release-age=0 --trust-lockfile

      - name: Lint
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['lint'] ? 0 : 1)"; then
            pnpm --config.minimum-release-age=0 lint
          else
            echo "No lint script; skipping"
          fi

      - name: Typecheck
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['typecheck'] ? 0 : 1)"; then
            pnpm --config.minimum-release-age=0 typecheck
          else
            echo "No typecheck script; skipping"
          fi

      - name: Test
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['test'] ? 0 : 1)"; then
            pnpm --config.minimum-release-age=0 test
          else
            echo "No test script; skipping"
          fi

      - name: Build
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['build'] ? 0 : 1)"; then
            pnpm --config.minimum-release-age=0 build
          else
            echo "No build script; skipping"
          fi

      - name: Verify package contents
        run: |
          pnpm pack --pack-destination /tmp
          tar -tzf /tmp/*.tgz | grep -q "package/dist/index.js"
          tar -tzf /tmp/*.tgz | grep -q "package/dist/index.d.ts"
          rm -f /tmp/*.tgz

      - name: Cleanup
        if: always()
        run: rm -f .npmrc
