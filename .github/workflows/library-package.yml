name: Vayva Library Package CI

on:
  workflow_call:
    inputs:
      package-name:
        description: Package name (e.g. vayva-personalization)
        required: false
        type: string
        default: ''
      optional-gates:
        description: >-
          Comma-separated list of gates this package legitimately does not
          implement (e.g. "lint"). A gate that is not listed here and has no
          matching package.json script FAILS the build instead of being
          skipped. Leave empty to require every gate.
        required: false
        default: ''
        type: string
    secrets:
      NPM_TOKEN:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      PNPM_MINIMUM_RELEASE_AGE: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm --version

      - name: Authenticate private registry
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "NPM_TOKEN not set — skipping private registry auth"
            exit 0
          fi
          echo "@vayva-tech:registry=https://npm.pkg.github.com/" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${NPM_TOKEN}" >> .npmrc
          echo "minimum-release-age=0" >> .npmrc
          echo "onlyBuiltDependencies[]=esbuild" >> .npmrc
          echo "onlyBuiltDependencies[]=workerd" >> .npmrc
          echo "onlyBuiltDependencies[]=@swc/core" >> .npmrc
          echo "onlyBuiltDependencies[]=@sentry/cli" >> .npmrc
          echo "onlyBuiltDependencies[]=@parcel/watcher" >> .npmrc
          echo "onlyBuiltDependencies[]=protobufjs" >> .npmrc
          echo "onlyBuiltDependencies[]=core-js-pure" >> .npmrc
          echo "onlyBuiltDependencies[]=unrs-resolver" >> .npmrc

      - name: Install
        run: pnpm install --frozen-lockfile --config.minimum-release-age=0

      - name: Lint
        env:
          OPTIONAL_GATES: ${{ inputs.optional-gates }}
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['lint'] ? 0 : 1)"; then
            pnpm --config.minimum-release-age=0 lint
          elif node -e "const opt=(process.env.OPTIONAL_GATES||'').split(',').map(s=>s.trim()).filter(Boolean); process.exit(opt.includes('lint')?0:1)"; then
            echo "No lint script; gate declared optional by the caller"
          else
            echo "::error::Required gate 'lint' is missing from package.json scripts. Add a 'lint' script, or declare 'lint' in the optional-gates input of this reusable workflow call. Skipping a gate is not allowed by default."
            exit 1
          fi

      - name: Typecheck
        env:
          OPTIONAL_GATES: ${{ inputs.optional-gates }}
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['typecheck'] ? 0 : 1)"; then
            pnpm --config.minimum-release-age=0 typecheck
          elif node -e "const opt=(process.env.OPTIONAL_GATES||'').split(',').map(s=>s.trim()).filter(Boolean); process.exit(opt.includes('typecheck')?0:1)"; then
            echo "No typecheck script; gate declared optional by the caller"
          else
            echo "::error::Required gate 'typecheck' is missing from package.json scripts. Add a 'typecheck' script, or declare 'typecheck' in the optional-gates input of this reusable workflow call. Skipping a gate is not allowed by default."
            exit 1
          fi

      - name: Test
        env:
          OPTIONAL_GATES: ${{ inputs.optional-gates }}
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['test'] ? 0 : 1)"; then
            pnpm --config.minimum-release-age=0 test
          elif node -e "const opt=(process.env.OPTIONAL_GATES||'').split(',').map(s=>s.trim()).filter(Boolean); process.exit(opt.includes('test')?0:1)"; then
            echo "No test script; gate declared optional by the caller"
          else
            echo "::error::Required gate 'test' is missing from package.json scripts. Add a 'test' script, or declare 'test' in the optional-gates input of this reusable workflow call. Skipping a gate is not allowed by default."
            exit 1
          fi

      - name: Build
        env:
          OPTIONAL_GATES: ${{ inputs.optional-gates }}
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['build'] ? 0 : 1)"; then
            pnpm --config.minimum-release-age=0 build
          elif node -e "const opt=(process.env.OPTIONAL_GATES||'').split(',').map(s=>s.trim()).filter(Boolean); process.exit(opt.includes('build')?0:1)"; then
            echo "No build script; gate declared optional by the caller"
          else
            echo "::error::Required gate 'build' is missing from package.json scripts. Add a 'build' script, or declare 'build' in the optional-gates input of this reusable workflow call. Skipping a gate is not allowed by default."
            exit 1
          fi

      - name: Verify package contents
        run: |
          pnpm pack --pack-destination /tmp
          tar -tzf /tmp/*.tgz | grep -q "package/dist/index.js"
          tar -tzf /tmp/*.tgz | grep -q "package/dist/index.d.ts"
          rm -f /tmp/*.tgz

      - name: Cleanup
        if: always()
        run: rm -f .npmrc
