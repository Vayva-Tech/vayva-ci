name: Vayva Staging Deployment

on:
  workflow_call:
    inputs:
      service-name:
        description: Service name (e.g. identity-service)
        required: true
        type: string
      release_sha:
        description: Git SHA to deploy (40-character commit hash)
        required: true
        type: string
      change_reference:
        description: Optional change reference for audit trail
        required: false
        type: string
        default: ''
    secrets:
      STAGING_SSH_KEY:
        required: true
      STAGING_SSH_HOST:
        required: true
      STAGING_SSH_USER:
        required: true

permissions:
  contents: read
  packages: read

env:
  STAGING_SSH_KNOWN_HOSTS: |
    13.140.159.213 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINzD4zKYZuxWOqiYVi7QJ7fpS8UqhD0htV13gjxAh5Yh
    13.140.159.213 ssh-rsa 

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      image_digest: ${{ steps.resolve.outputs.image_digest }}
    steps:
      - name: Validate SHA format
        run: |
          SHA="${{ inputs.release_sha }}"
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: release_sha must be exactly 40 hexadecimal characters"
            echo "Provided: $SHA"
            exit 1
          fi
          echo "SHA format: OK"

      - name: Verify GHCR image exists
        id: resolve
        env:
          SERVICE: ${{ inputs.service-name }}
          SHA: ${{ inputs.release_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          IMAGE_TAG="sha-${SHA}"
          OWNER="${{ github.repository_owner }}"

          echo "Checking for image: ghcr.io/${OWNER}/${SERVICE}:${IMAGE_TAG}"

          if ! VERSION_JSON=$(gh api "/orgs/${OWNER}/packages/container/${SERVICE}/versions" 2>/dev/null); then
            echo "ERROR: Failed to query package versions for ${SERVICE}"
            exit 1
          fi

          if ! echo "${VERSION_JSON}" | jq -e ".[] | select(.metadata.container.tags[] == \"${IMAGE_TAG}\")" > /dev/null 2>&1; then
            echo "ERROR: Image tag ${IMAGE_TAG} does not exist in GHCR for ${SERVICE}"
            echo "Available tags:"
            echo "${VERSION_JSON}" | jq -r '.[].metadata.container.tags[]' | head -10
            exit 1
          fi

          DIGEST=$(echo "${VERSION_JSON}" | jq -r ".[] | select(.metadata.container.tags[] == \"${IMAGE_TAG}\") | .name" | head -1)
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Image verified: ghcr.io/${OWNER}/${SERVICE}:${IMAGE_TAG}@${DIGEST}"

  deploy:
    name: Deploy to Staging
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Record deployment start
        env:
          SERVICE: ${{ inputs.service-name }}
          SHA: ${{ inputs.release_sha }}
          IMAGE_TAG: ${{ needs.validate.outputs.image_tag }}
          IMAGE_DIGEST: ${{ needs.validate.outputs.image_digest }}
          CHANGE_REF: ${{ inputs.change_reference }}
        run: |
          echo "=== Staging Deployment Started ==="
          echo "Service:        ${SERVICE}"
          echo "Release SHA:    ${SHA}"
          echo "Image Tag:      ${IMAGE_TAG}"
          echo "Image Digest:   ${IMAGE_DIGEST}"
          echo "Change Ref:     ${CHANGE_REF:-<none>}"
          echo "Timestamp:      $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Actor:          ${{ github.actor }}"
          echo "=================================="

      - name: Deploy to staging
        env:
          SERVICE: ${{ inputs.service-name }}
          IMAGE_TAG: ${{ needs.validate.outputs.image_tag }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/vayva_staging
          chmod 600 ~/.ssh/vayva_staging
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -i ~/.ssh/vayva_staging "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}" \
            "/opt/vayva-staging/infrastructure-staging/scripts/deploy-staging.sh '${SERVICE}' '${IMAGE_TAG}' --migrate"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/vayva_staging

      - name: Record deployment completion
        if: success()
        env:
          SERVICE: ${{ inputs.service-name }}
          SHA: ${{ inputs.release_sha }}
          IMAGE_TAG: ${{ needs.validate.outputs.image_tag }}
          IMAGE_DIGEST: ${{ needs.validate.outputs.image_digest }}
        run: |
          echo "=== Staging Deployment Complete ==="
          echo "Service:        ${SERVICE}"
          echo "Release SHA:    ${SHA}"
          echo "Image Tag:      ${IMAGE_TAG}"
          echo "Image Digest:   ${IMAGE_DIGEST}"
          echo "Timestamp:      $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Status:         SUCCESS"
          echo "==================================="
