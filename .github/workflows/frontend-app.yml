name: Vayva Frontend App CI

on:
  workflow_call:
    inputs:
      app-name:
        description: App directory name (e.g. vayva-merchant)
        required: true
        type: string
      build-env:
        description: Build-time env vars (KEY=VALUE per line, e.g. NEXT_PUBLIC_APP_URL=...)
        required: false
        default: ''
        type: string
    secrets:
      NPM_TOKEN:
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.app-name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

env:
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  quality:
    name: Quality (typecheck + lint + test)
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      PNPM_MINIMUM_RELEASE_AGE: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm --version

      - name: Authenticate private registry
        run: |
          echo "@vayva-tech:registry=https://npm.pkg.github.com/" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc
          echo "minimum-release-age=0" >> .npmrc

      - name: Install
        run: pnpm install --frozen-lockfile --config.minimum-release-age=0

      - name: Typecheck
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['typecheck'] ? 0 : 1)"; then
            pnpm --config.minimum-release-age=0 typecheck
          else
            echo "No typecheck script; skipping"
          fi

      - name: Lint
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['lint'] ? 0 : 1)"; then
            pnpm --config.minimum-release-age=0 lint
          else
            echo "No lint script; skipping"
          fi

      - name: Test
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['test'] ? 0 : 1)"; then
            pnpm --config.minimum-release-age=0 test
          else
            echo "No test script; skipping"
          fi

      - name: Cleanup
        if: always()
        run: rm -f .npmrc

  build-and-push:
    name: Build & Push
    runs-on: self-hosted
    needs: [quality]
    timeout-minutes: 25
    env:
      PNPM_MINIMUM_RELEASE_AGE: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm --version

      - name: Authenticate private registry
        run: |
          echo "@vayva-tech:registry=https://npm.pkg.github.com/" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc
          echo "minimum-release-age=0" >> .npmrc

      - name: Install
        run: pnpm install --frozen-lockfile --config.minimum-release-age=0

      - name: Setup Next.js persistent cache
        run: |
          mkdir -p ~/nextjs-cache/"${{ inputs.app-name }}"
          mkdir -p .next
          ln -sfn ~/nextjs-cache/"${{ inputs.app-name }}" .next/cache

      - name: Build Next.js
        env:
          BUILD_ENV: ${{ inputs.build-env }}
        run: |
          while IFS= read -r line; do
            [ -n "$line" ] && export "$line"
          done <<< "$BUILD_ENV"
          pnpm --config.minimum-release-age=0 build

      - name: Runner disk guard
        run: |
          df -h / | tail -1
          USAGE=$(df / --output=pcent | tail -1 | tr -dc '0-9')
          if [ "$USAGE" -gt 80 ]; then docker image prune -f; fi

      - name: Docker build
        env:
          APP: ${{ inputs.app-name }}
          SHA: ${{ github.sha }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          docker build \
            --secret id=vayva_npm_token,env=NPM_TOKEN \
            -t "ghcr.io/vayva-tech/${APP}:${IMAGE_TAG}" \
            -t "ghcr.io/vayva-tech/${APP}:sha-latest" \
            -t "vayva-ci/${APP}:${SHA}" \
            -f Dockerfile \
            .

      - name: Frontend startup smoke test
        env:
          APP: ${{ inputs.app-name }}
          SHA: ${{ github.sha }}
        run: |
          CID=$(docker run -d -p 3000:3000 \
            -e PORT=3000 \
            -e NODE_ENV=production \
            --name "vayva-smoke-${APP}" \
            "vayva-ci/${APP}:${SHA}")

          for i in $(seq 1 15); do
            sleep 2
            if ! docker ps -q --filter id="$CID" | grep -q .; then
              echo "CONTAINER EXITED — logs follow:"
              docker logs "$CID" 2>&1 | tail -40
              docker rm -f "$CID" > /dev/null
              exit 1
            fi
          done

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ 2>/dev/null || echo "000")
          echo "HTTP status: ${HTTP_CODE}"

          docker logs "$CID" 2>&1 | tail -15
          docker rm -f "$CID" > /dev/null
          echo "Frontend smoke test passed — container booted and stayed alive (HTTP ${HTTP_CODE})"

      - name: Push to GHCR (main only)
        env:
          APP: ${{ inputs.app-name }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ]; then
            echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker push "ghcr.io/vayva-tech/${APP}:${IMAGE_TAG}"
            docker push "ghcr.io/vayva-tech/${APP}:sha-latest"
            echo "Pushed ghcr.io/vayva-tech/${APP}:${IMAGE_TAG}"
          else
            echo "Skipping registry push (not main push)"
          fi

      - name: Capture image digest
        id: digest
        env:
          APP: ${{ inputs.app-name }}
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "ghcr.io/vayva-tech/${APP}:${IMAGE_TAG}" 2>/dev/null || echo "none")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Image digest: $DIGEST"

      - name: Record deployment manifest
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          APP: ${{ inputs.app-name }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          mkdir -p deploy-manifests
          cat > "deploy-manifests/${APP}.yaml" <<EOF
          service: ${APP}
          commit: ${{ github.sha }}
          image: ghcr.io/vayva-tech/${APP}:${IMAGE_TAG}
          digest: ${DIGEST}
          built_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          built_by: ${{ github.actor }}
          EOF
          echo "Manifest recorded:"
          cat "deploy-manifests/${APP}.yaml"

      - name: Upload deployment manifest
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: deploy-manifest-${{ inputs.app-name }}
          path: deploy-manifests/
          retention-days: 90

      - name: Docker cleanup
        if: always()
        env:
          APP: ${{ inputs.app-name }}
          SHA: ${{ github.sha }}
        run: |
          docker rmi "vayva-ci/${APP}:${SHA}" "ghcr.io/vayva-tech/${APP}:${IMAGE_TAG}" "ghcr.io/vayva-tech/${APP}:sha-latest" 2>/dev/null || true

      - name: Cleanup
        if: always()
        run: rm -f .npmrc
