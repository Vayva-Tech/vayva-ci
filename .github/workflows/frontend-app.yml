name: Vayva Frontend App CI

on:
  workflow_call:
    inputs:
      app-name:
        description: App directory name (e.g. vayva-merchant)
        required: true
        type: string
      build-env:
        description: Build-time env vars (KEY=VALUE per line, e.g. NEXT_PUBLIC_APP_URL=...)
        required: false
        default: ''
        type: string
      deploy:
        description: Deploy to production after successful push
        required: false
        type: boolean
        default: false
    secrets:
      NPM_TOKEN:
        required: true
      VAYVA_CI_APP_ID:
        required: true
      VAYVA_CI_PRIVATE_KEY:
        required: true
      PROD_SSH_KEY:
        required: false
      PROD_SSH_HOST:
        required: false
      PROD_SSH_USER:
        required: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  quality:
    name: Quality (typecheck + lint + test)
    runs-on: self-hosted
    env:
      PNPM_MINIMUM_RELEASE_AGE: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm --version

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.VAYVA_CI_APP_ID }}
          private-key: ${{ secrets.VAYVA_CI_PRIVATE_KEY }}
          owner: Vayva-Tech

      - name: Authenticate private registry
        run: |
          echo "@vayva-tech:registry=https://npm.pkg.github.com/" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc
          echo "minimum-release-age=0" >> .npmrc
          echo "onlyBuiltDependencies[]=esbuild" >> .npmrc
          echo "onlyBuiltDependencies[]=workerd" >> .npmrc
          echo "onlyBuiltDependencies[]=@swc/core" >> .npmrc
          echo "onlyBuiltDependencies[]=@sentry/cli" >> .npmrc
          echo "onlyBuiltDependencies[]=@parcel/watcher" >> .npmrc
          echo "onlyBuiltDependencies[]=protobufjs" >> .npmrc
          echo "onlyBuiltDependencies[]=core-js-pure" >> .npmrc
          echo "onlyBuiltDependencies[]=unrs-resolver" >> .npmrc

      - name: Set up workspace dependencies
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          WS_DEPS=$(node -e "
            const p=require('./package.json');
            const d={...p.dependencies,...(p.devDependencies||{})};
            const w=Object.keys(d).filter(k=>String(d[k]).startsWith('workspace:'));
            if(w.length) console.log(w.map(k=>k.replace('@vayva-tech/','')).join(' '));
          ")
          if [ -n "$WS_DEPS" ]; then
            echo "Setting up workspace deps: $WS_DEPS"
            for pkg in $WS_DEPS; do
              if [ ! -d "vayva-$pkg" ]; then
                echo "Cloning vayva-$pkg..."
                git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/Vayva-Tech/vayva-$pkg.git" "vayva-$pkg"
              fi
            done
            PKG_LIST=$(echo "$WS_DEPS" | awk '{for(i=1;i<=NF;i++) print "  - \"./vayva-" $i "\""}')
            printf 'packages:\n  - "."\n%s\n' "$PKG_LIST" > pnpm-workspace.yaml
            rm -f pnpm-lock.yaml
            pnpm install --no-frozen-lockfile --config.minimum-release-age=0
            for dir in vayva-*/; do
              [ -f "$dir/tsconfig.json" ] && npx tsc --project "$dir/tsconfig.json" || true
            done
          else
            rm -f pnpm-lock.yaml
            pnpm install --no-frozen-lockfile --config.minimum-release-age=0
          fi

      - name: Typecheck
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['typecheck'] ? 0 : 1)"; then
            pnpm --config.minimum-release-age=0 typecheck
          else
            echo "No typecheck script; skipping"
          fi

      - name: Lint
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['lint'] ? 0 : 1)"; then
            pnpm --config.minimum-release-age=0 lint
          else
            echo "No lint script; skipping"
          fi

      - name: Test
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['test'] ? 0 : 1)"; then
            pnpm --config.minimum-release-age=0 test
          else
            echo "No test script; skipping"
          fi
        continue-on-error: true

  build-and-push:
    name: Build & Push
    runs-on: self-hosted
    needs: [quality]
    env:
      PNPM_MINIMUM_RELEASE_AGE: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm --version

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.VAYVA_CI_APP_ID }}
          private-key: ${{ secrets.VAYVA_CI_PRIVATE_KEY }}
          owner: Vayva-Tech

      - name: Authenticate private registry
        run: |
          echo "@vayva-tech:registry=https://npm.pkg.github.com/" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc
          echo "minimum-release-age=0" >> .npmrc
          echo "onlyBuiltDependencies[]=esbuild" >> .npmrc
          echo "onlyBuiltDependencies[]=workerd" >> .npmrc
          echo "onlyBuiltDependencies[]=@swc/core" >> .npmrc
          echo "onlyBuiltDependencies[]=@sentry/cli" >> .npmrc
          echo "onlyBuiltDependencies[]=@parcel/watcher" >> .npmrc
          echo "onlyBuiltDependencies[]=protobufjs" >> .npmrc
          echo "onlyBuiltDependencies[]=core-js-pure" >> .npmrc
          echo "onlyBuiltDependencies[]=unrs-resolver" >> .npmrc

      - name: Set up workspace dependencies
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          WS_DEPS=$(node -e "
            const p=require('./package.json');
            const d={...p.dependencies,...(p.devDependencies||{})};
            const w=Object.keys(d).filter(k=>String(d[k]).startsWith('workspace:'));
            if(w.length) console.log(w.map(k=>k.replace('@vayva-tech/','')).join(' '));
          ")
          if [ -n "$WS_DEPS" ]; then
            echo "Setting up workspace deps: $WS_DEPS"
            for pkg in $WS_DEPS; do
              if [ ! -d "vayva-$pkg" ]; then
                echo "Cloning vayva-$pkg..."
                git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/Vayva-Tech/vayva-$pkg.git" "vayva-$pkg"
              fi
            done
            PKG_LIST=$(echo "$WS_DEPS" | awk '{for(i=1;i<=NF;i++) print "  - \"./vayva-" $i "\""}')
            printf 'packages:\n  - "."\n%s\n' "$PKG_LIST" > pnpm-workspace.yaml
            rm -f pnpm-lock.yaml
            pnpm install --no-frozen-lockfile --config.minimum-release-age=0
            for dir in vayva-*/; do
              [ -f "$dir/tsconfig.json" ] && npx tsc --project "$dir/tsconfig.json" || true
            done
          else
            rm -f pnpm-lock.yaml
            pnpm install --no-frozen-lockfile --config.minimum-release-age=0
          fi

      - name: Build Next.js
        env:
          BUILD_ENV: ${{ inputs.build-env }}
        run: |
          while IFS= read -r line; do
            [ -n "$line" ] && export "$line"
          done <<< "$BUILD_ENV"
          pnpm --config.minimum-release-age=0 build

      - name: Runner disk guard
        run: |
          df -h / | tail -1
          USAGE=$(df / --output=pcent | tail -1 | tr -dc '0-9')
          if [ "$USAGE" -gt 80 ]; then docker image prune -f; fi

      - name: Prepare Docker build context
        env:
          APP: ${{ inputs.app-name }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -e
          CTX="/tmp/docker-context"
          rm -rf "$CTX"
          mkdir -p "$CTX/$APP"
          for item in $(ls -A "$GITHUB_WORKSPACE"); do
            mv "$GITHUB_WORKSPACE/$item" "$CTX/$APP/"
          done
          PACKAGES=(
            vayva-shared vayva-schemas vayva-middleware vayva-auth-middleware
            vayva-redis vayva-event-bus vayva-email vayva-compliance
            vayva-sdk vayva-plan-entitlements vayva-personalization
            vayva-semantic-layer vayva-ui
          )
          for pkg in "${PACKAGES[@]}"; do
            echo "Cloning $pkg for Docker context..."
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/Vayva-Tech/$pkg.git" "$CTX/$pkg"
          done

      - name: Docker build
        env:
          APP: ${{ inputs.app-name }}
          SHA: ${{ github.sha }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          docker build \
            --build-arg NODE_AUTH_TOKEN="$NPM_TOKEN" \
            -t "ghcr.io/vayva-tech/${APP}:${IMAGE_TAG}" \
            -t "ghcr.io/vayva-tech/${APP}:sha-latest" \
            -t "vayva-ci/${APP}:${SHA}" \
            -f "/tmp/docker-context/${APP}/Dockerfile" \
            /tmp/docker-context

      - name: Push to GHCR (main only)
        env:
          APP: ${{ inputs.app-name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ]; then
            echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker push "ghcr.io/vayva-tech/${APP}:${IMAGE_TAG}"
            docker push "ghcr.io/vayva-tech/${APP}:sha-latest"
            echo "Pushed ghcr.io/vayva-tech/${APP}:${IMAGE_TAG}"
          else
            echo "Skipping registry push (not main push)"
          fi

      - name: Deploy to production
        if: inputs.deploy && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          APP: ${{ inputs.app-name }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/vayva_prod
          chmod 600 ~/.ssh/vayva_prod
          ssh-keyscan -H "${{ secrets.PROD_SSH_HOST }}" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/vayva_prod "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}" \
            "/opt/vayva/scripts/deploy-service.sh '${APP}' '${IMAGE_TAG}'"

      - name: Docker cleanup
        if: always()
        env:
          APP: ${{ inputs.app-name }}
          SHA: ${{ github.sha }}
        run: |
          docker rmi "vayva-ci/${APP}:${SHA}" "ghcr.io/vayva-tech/${APP}:${IMAGE_TAG}" "ghcr.io/vayva-tech/${APP}:sha-latest" 2>/dev/null || true
          rm -rf /tmp/docker-context
          rm -f ~/.ssh/vayva_prod
