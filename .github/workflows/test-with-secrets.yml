name: Test With Secrets

on:
  workflow_call:
    inputs:
      message:
        description: Test message
        required: true
        type: string
    secrets:
      STAGING_SSH_KEY:
        required: true
      STAGING_SSH_HOST:
        required: true
      STAGING_SSH_USER:
        required: true

jobs:
  echo:
    runs-on: ubuntu-latest
    steps:
      - name: Echo message
        run: |
          echo "${{ inputs.message }}"
          echo "SSH_HOST is set: ${{ secrets.STAGING_SSH_HOST != '' }}"
