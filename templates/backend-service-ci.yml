# Backend service CI — calls Vayva-Tech/vayva-ci reusable workflow
# Copy this file to .github/workflows/ci.yml in your service repo.
# Update service-name and service-port to match your service.
# Add smoke-extra-env only if your service needs extra env vars to boot.
#
# DEPLOYMENT IS SEPARATE: CI only validates, builds, and publishes images.
# Staging and production deployments use separate workflow_dispatch workflows.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: Vayva-Tech/vayva-ci/.github/workflows/backend-service.yml@v1
    with:
      service-name: SERVICE_NAME        # e.g. identity-service
      service-port: 4000                # e.g. 4010 for identity-service
      # smoke-extra-env: ''             # KEY=VALUE per line if needed
    secrets: inherit
